# GOAL-008 S2 / I-008-001 §4 — nginx: single-origin SPA + /api reverse proxy.
# The SPA uses relative /api/* paths (no VITE_ API base), so same-origin
# reverse-proxying to the `api` compose service is required and needs no CORS.
#
# D-001 P1 hardening: client_max_body_size aligns with the API's 8 MiB upload
# limit (maxUploadBytes), server_tokens off hides the nginx version, and the
# baseline security headers (nosniff / X-Frame-Options / Referrer-Policy /
# conservative CSP) apply to every response. Full HSTS / production CDN CSP is
# deployment-layer and out of scope (W3 residual list).
# Reverse proxy -> api service (compose service name `api`). Must live at the
# http level (outside `server {}`): `upstream` is not valid inside server context
# (nginx [emerg] at startup — post-go break F-1b, introduced by VP-009 W3 7dbc3b5).
upstream api_upstream {
    server api:25080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The manifest is a public API projection. Exact matching prevents the
    # built-in static fixture from becoming a production fallback.
    location = /.well-known/schema-ui/app-manifest.json {
        proxy_pass http://api:25080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # API reverse proxy -> api service. X-Real-IP is set to the direct peer so
    # the API can rate-limit failed logins by real client behind the trusted
    # reverse proxy (rate_limit.go · D-001 P1).
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # SPA fallback: direct route refreshes (e.g. /list-edit-lifecycle) fall back
    # to index.html so client-side routing keeps working.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
