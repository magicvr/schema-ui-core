<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>schema-ui-core Admin</title>
    <!--
      FOUC bootstrap (S1 · C3 + W8 F-002): synchronous external script applied
      before any paint. Reads localStorage.theme and prefers-color-scheme to
      add the `dark` class and set color-scheme on <html> in the very first
      frame. Keeping it external lets the production CSP stay script-src 'self'
      without needing an inline-script hash/nonce.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
