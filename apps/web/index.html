<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>schema-ui-core Admin</title>
    <!--
      FOUC bootstrap (S1 · C3): synchronous inline script applied before any
      paint.  Reads localStorage.theme and prefers-color-scheme to add the
      `dark` class and set color-scheme on <html> in the very first frame.
      No external dependency — intentionally kept minimal and synchronous.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored === "dark" || (!stored && prefersDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {
          // localStorage may be unavailable in some privacy contexts.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
