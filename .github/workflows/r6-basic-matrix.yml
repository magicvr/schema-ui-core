name: r6-basic-matrix

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  web:
    name: web (Linux, Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  api:
    name: api (Linux, Go 1.26)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Reject active records-resource residue
        working-directory: ${{ github.workspace }}
        run: |
          legacy_api='/api/'"records"
          legacy_env='SMOKE_'"RECORD_ID"
          legacy_import='renderer/'"records"
          legacy_file='records'".ts"
          if grep -R -n -E "$legacy_api|$legacy_env|$legacy_import|$legacy_file" \
            --exclude='*.test.ts' --exclude='*.test.tsx' \
            .github/workflows scripts apps/web/src apps/api/internal/handler; then
            echo "active records-resource residue detected"
            exit 1
          fi
      - run: go test ./...
      - run: go build ./...

  browser-e2e:
    name: browser E2E (Linux, Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container-smoke:
    name: container smoke (docker compose · R5 S2/S4)
    runs-on: ubuntu-latest
    env:
      AUTH_JWT_SECRET: ci-test-secret-goal011-at-least-32-bytes
      ADMIN_INITIAL_PASSWORD: ci-admin
      SMOKE_ISOLATION_ID: ci-container-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build images (isolated project)
        run: docker compose -p ci-container-smoke build
      - name: Start services (isolated project)
        run: docker compose -p ci-container-smoke up -d
      - name: Wait for api + web ready
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:8081/ >/dev/null 2>&1; then
              echo "compose services ready"; exit 0
            fi
            sleep 3
          done
          echo "compose services failed to become ready"; exit 1
      - name: Run S4 smoke (SM-001~006, disposable seed reproducibility · I-008-002 v0.1.2)
        run: |
          SMOKE_USERNAME=admin SMOKE_PASSWORD=ci-admin \
          SMOKE_SEED_ID=user-admin SMOKE_EXPECTED_SEED_TOTAL=1 \
          SMOKE_ISOLATION_ID=ci-container-smoke \
          SMOKE_DISPOSABLE_CONFIRM=yes \
          bash scripts/smoke.sh --disposable
        shell: bash
      - name: Persistence across api restart (C-006)
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8081/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["accessToken"])')
          NEW_USER_ID=$(curl -fsS -X POST http://127.0.0.1:8081/api/users \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"username":"ci-persist","name":"CI Persist","password":"ci-persist-password"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          test -n "$NEW_USER_ID"
          docker compose -p ci-container-smoke restart api
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 2
          done
          curl -fsS "http://127.0.0.1:8081/api/users/$NEW_USER_ID" -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["id"]=="'"$NEW_USER_ID"'"'
          echo "user persisted across api container restart OK"
      - name: Teardown (isolated project)
        if: always()
        run: docker compose -p ci-container-smoke down -v
