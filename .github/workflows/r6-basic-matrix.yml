name: r6-basic-matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: web (Linux, Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  api:
    name: api (Linux, Go 1.26)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Reject active records-resource residue
        working-directory: ${{ github.workspace }}
        run: |
          legacy_api='/api/'"records"
          legacy_env='SMOKE_'"RECORD_ID"
          legacy_import='renderer/'"records"
          legacy_file='records'".ts"
          if grep -R -n -E "$legacy_api|$legacy_env|$legacy_import|$legacy_file" \
            --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*_test.go' \
            .github/workflows scripts apps/web/src apps/api/internal/handler; then
            echo "active records-resource residue detected"
            exit 1
          fi
      - name: Reject retired assembly symbols
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if grep -R -n -E \
            'func[[:space:]]+(MountProviderRoutes|RegisterSettings|RegisterActivity)[[:space:]]*\(|staticSchemaDocuments|schemaDocumentsForPlan|compiledMigrations|seedRBAC' \
            --include='*.go' --exclude='*_test.go' apps/api/internal; then
            echo "retired assembly symbol residue detected"
            exit 1
          fi
      - name: Reject retired Schema and Manifest paths
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          old_schema='apps/api/internal/handler/'"fixtures/schema"
          old_manifest='apps/web/public/.well-known/schema-ui/'"app-manifest.json"
          test ! -e "$old_schema"
          test ! -e "$old_manifest"
          if git grep -n -F -e "$old_schema" -e "$old_manifest" -- \
            README.md QUICKSTART.md compose.yaml scripts apps .github/workflows; then
            echo "retired Schema/Manifest path residue detected outside governance history"
            exit 1
          fi
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  # Dual-dialect gate: the whole Go suite is exercised again against a local
  # PostgreSQL (all DB tests run on sqlite by default; the postgres-gated tests
  # light up when PG_TEST_* are set). A superuser account creates & drops the
  # scratch databases the integration tests use.
  api-postgres:
    name: api + postgres (Linux, Go 1.26)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PG_TEST_HOST: localhost
      PG_TEST_PORT: "5432"
      PG_TEST_USER: postgres
      PG_TEST_PASSWORD: postgres
      PG_TEST_DB: postgres
      PG_TEST_SSLMODE: disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  browser-e2e:
    name: browser E2E (${{ matrix.profile }} / ${{ matrix.dialect }}, Linux, Node 22)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [mvp, admin]
        # W24 (GOAL-035): the acceptance-stage browser suite runs once per
        # store dialect. sqlite = default fresh temp file; postgres = the
        # harness provisions a dedicated scratch database per run via
        # apps/api/cmd/e2e-pgset (create → run → drop).
        dialect: [sqlite, postgres]
    env:
      APP_PROFILE: ${{ matrix.profile }}
      # The harness dialect contract (playwright.config.ts); explicit value so
      # the intended target is unambiguous in logs.
      DB_DIALECT: ${{ matrix.dialect }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # go is required by the postgres leg (cmd/e2e-pgset provisioning and the
      # API server); harmless for the sqlite legs.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Postgres connection env (postgres legs only)
        if: matrix.dialect == 'postgres'
        run: |
          echo "DB_HOST=localhost" >> "$GITHUB_ENV"
          echo "DB_PORT=5432" >> "$GITHUB_ENV"
          echo "DB_USER=postgres" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=postgres" >> "$GITHUB_ENV"
          echo "DB_SSLMODE=disable" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container-smoke:
    name: container smoke (${{ matrix.profile }}, docker compose)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [mvp, admin]
    env:
      AUTH_JWT_SECRET: ci-test-secret-goal011-at-least-32-bytes
      ADMIN_INITIAL_PASSWORD: ci-admin
      PRERELEASE_PROFILE: ${{ matrix.profile }}
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install web deps + Playwright Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run pre-release smoke (S4 disposable + CSP + C-006 persistence)
        run: bash scripts/pre-release-smoke.sh
