name: r6-basic-matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: web (Linux, Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  api:
    name: api (Linux, Go 1.26)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Reject active records-resource residue
        working-directory: ${{ github.workspace }}
        run: |
          legacy_api='/api/'"records"
          legacy_env='SMOKE_'"RECORD_ID"
          legacy_import='renderer/'"records"
          legacy_file='records'".ts"
          if grep -R -n -E "$legacy_api|$legacy_env|$legacy_import|$legacy_file" \
            --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*_test.go' \
            .github/workflows scripts apps/web/src apps/api/internal/handler; then
            echo "active records-resource residue detected"
            exit 1
          fi
      - name: Reject retired assembly symbols
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if grep -R -n -E \
            'func[[:space:]]+(MountProviderRoutes|RegisterSettings|RegisterActivity)[[:space:]]*\(|staticSchemaDocuments|schemaDocumentsForPlan|compiledMigrations|seedRBAC' \
            --include='*.go' --exclude='*_test.go' apps/api/internal; then
            echo "retired assembly symbol residue detected"
            exit 1
          fi
      - name: Reject retired Schema and Manifest paths
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          old_schema='apps/api/internal/handler/'"fixtures/schema"
          old_manifest='apps/web/public/.well-known/schema-ui/'"app-manifest.json"
          test ! -e "$old_schema"
          test ! -e "$old_manifest"
          if git grep -n -F -e "$old_schema" -e "$old_manifest" -- \
            README.md QUICKSTART.md compose.yaml scripts apps .github/workflows; then
            echo "retired Schema/Manifest path residue detected outside governance history"
            exit 1
          fi
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  browser-e2e:
    name: browser E2E (${{ matrix.profile }}, Linux, Node 22)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [mvp, admin]
    env:
      APP_PROFILE: ${{ matrix.profile }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container-smoke:
    name: container smoke (${{ matrix.profile }}, docker compose)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [mvp, admin]
    env:
      APP_PROFILE: ${{ matrix.profile }}
      AUTH_JWT_SECRET: ci-test-secret-goal011-at-least-32-bytes
      ADMIN_INITIAL_PASSWORD: ci-admin
      SMOKE_ISOLATION_ID: ci-container-${{ matrix.profile }}
      SMOKE_EXPECTED_PROFILE: ${{ matrix.profile }}
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build images (isolated project)
        run: docker compose -p "$SMOKE_ISOLATION_ID" build
      - name: Start services (isolated project)
        run: docker compose -p "$SMOKE_ISOLATION_ID" up -d
      - name: Wait for api + web ready
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:25080/readyz >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:25081/ >/dev/null 2>&1; then
              echo "compose services ready"; exit 0
            fi
            sleep 3
          done
          echo "compose services failed to become ready"; exit 1
      - name: Run S4 smoke (SM-001~006, disposable seed reproducibility · I-008-002 v0.1.2)
        run: |
          SMOKE_USERNAME=admin SMOKE_PASSWORD=ci-admin \
          SMOKE_SEED_ID=user-admin SMOKE_EXPECTED_SEED_TOTAL=1 \
          SMOKE_ISOLATION_ID="$SMOKE_ISOLATION_ID" \
          SMOKE_EXPECTED_PROFILE="$APP_PROFILE" \
          SMOKE_DISPOSABLE_CONFIRM=yes \
          bash scripts/smoke.sh --disposable
        shell: bash
      - name: Persistence across api restart (C-006)
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:25081/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["accessToken"])')
          NEW_USER_ID=$(curl -fsS -X POST http://127.0.0.1:25081/api/users \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"username":"ci-persist","name":"CI Persist","password":"ci-persist-password"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          test -n "$NEW_USER_ID"
          docker compose -p "$SMOKE_ISOLATION_ID" restart api
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:25080/readyz >/dev/null 2>&1 && break; sleep 2
          done
          curl -fsS "http://127.0.0.1:25081/api/users/$NEW_USER_ID" -H "Authorization: Bearer $TOKEN" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["id"]=="'"$NEW_USER_ID"'"'
          echo "user persisted across api container restart OK"
      - name: Teardown (isolated project)
        if: always()
        run: docker compose -p "$SMOKE_ISOLATION_ID" down -v
